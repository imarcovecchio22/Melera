<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&family=Lato:wght@300;400&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width: 1080px; height: 1080px; overflow: hidden;
    background: #1a0f05;
    font-family: 'Space Grotesk', sans-serif;
    position: relative;
  }

  /* triángulo grande esquina superior derecha */
  .tri-tr {
    position: absolute;
    top: 0; right: 0;
    width: 0; height: 0;
    border-style: solid;
    border-width: 0 420px 420px 0;
    border-color: transparent #2a1508 transparent transparent;
  }

  /* rombo central decorativo */
  .diamond {
    position: absolute;
    top: 50%; left: 55%;
    transform: translate(-50%, -50%) rotate(45deg);
    width: 500px; height: 500px;
    border: 1px solid rgba(232,151,10,0.08);
  }
  .diamond-2 {
    position: absolute;
    top: 50%; left: 55%;
    transform: translate(-50%, -50%) rotate(45deg);
    width: 380px; height: 380px;
    border: 1px solid rgba(232,151,10,0.05);
  }

  /* línea diagonal */
  .diag-line {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
  }

  /* bloque ámbar inferior */
  .amber-block {
    position: absolute;
    bottom: 0; left: 0;
    width: 480px; height: 6px;
    background: #e8970a;
  }

  /* punto ámbar */
  .dot-accent {
    position: absolute;
    top: 70px; right: 70px;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: #e8970a;
  }

  .content {
    position: relative;
    z-index: 2;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 80px;
  }

  .top { display: flex; flex-direction: column; gap: 6px; }

  .tag {
    font-size: 13px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: #e8970a;
    font-weight: 300;
  }

  .titulo {
    font-size: 110px;
    font-weight: 700;
    color: #fdf3e3;
    line-height: 0.9;
    letter-spacing: -4px;
    max-width: 680px;
  }

  .titulo span {
    color: #e8970a;
  }

  .middle {
    display: flex;
    flex-direction: column;
    gap: 20px;
    max-width: 500px;
  }

  .bar { width: 40px; height: 3px; background: #e8970a; }

  .subtitulo {
    font-family: 'Lato', sans-serif;
    font-size: 22px;
    font-weight: 300;
    color: rgba(253,243,227,0.6);
    line-height: 1.6;
  }

  .bottom {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
  }

  .marca {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 18px;
    letter-spacing: 8px;
    text-transform: uppercase;
    color: rgba(232,151,10,0.5);
    font-weight: 300;
  }

  .marca-icon {
    width: 64px;
    height: 64px;
    flex-shrink: 0;
  }

  .tagline-b {
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(253,243,227,0.2);
    font-weight: 300;
  }
</style>
</head>
